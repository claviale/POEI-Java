<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" defer></script>
</head>
<body>
    <!-- Utilisation d'un container sans row -->
    <div class="container">
        <div class="col-8" style="background-color: brown;">Un petit peu de texte</div>
        <div class="col-4" style="background-color: blue;">Un petit peu de texte</div>
        <div class="col" style="background-color: green;">Un petit peu de texte</div>
    </div>
    <hr>
    <!-- Utilisation d'un container avec row -->
    <div class="container">
        <div class="row">
            <div class="col-lg-4 col-md-6 col-12 bg-success">Un petit peu de texte</div>
            <div class="col bg-secondary">Un petit peu de texte</div>
            <div class="col bg-primary">Un petit peu de texte</div>
        </div>
    </div>
    <hr>
    <div class="container">
        <button class="col-md-4 col-12 btn btn-primary">Cliquez moi!</button>
        <button class="btn btn-secondary">Cliquez moi!</button>
        <button class="btn btn-secondary"><i class="bi bi-plus-circle"></i></button>
        <i class="bi bi-plus-circle"></i>
        <i class="bi bi-emoji-smile text-success fs-2"></i>
    </div>
</body>
</html>
