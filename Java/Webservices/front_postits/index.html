<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Document</title>
    <script src="webservices.js" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container text-center mt-5">
    <div class="row justify-content-center">
        <div class="col-10 col-lg-6">
            <form id="addPostIt">
                <h1 class="m-3 vert">Ajouter une note</h1>
                <div class="form-group">
                    <input type="text" class="form-control" id="titre" placeholder="Titre">
                </div>
                <div class="form-group">
                    <textarea id="contenu" class="form-control" rows="8" placeholder="Votre texte ici"></textarea>
                </div>
                <div class="col-8 col-lg-6 m-auto">
                    <input type="color" id="couleur" class="p-1 form-control form-control-color" value="#f6b73c">
                </div class="form-group">
                <input type="submit" class="btn btn-outline-success m-3" value="Ajouter une note">
            </form>
        </div>
    </div>
</div>

    <div class="container-fluid text-center mt-5">
        <div class="row justify-content-center align-items-center">
            <div class="col ">
            <div id="container" class="row justify-content-around  " ></div>
            </div>
        </div>
    </div>
   
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
</body>
</html>
