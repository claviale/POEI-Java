<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="webservices.js" defer></script>
</head>
<body>
    <h1>Application prise de notes</h1>

    <form id="addPostIt">
        <h2>Ajouter une note</h2>
        <div>
            <input type="text" id="titre" placeholder="Titre">
        </div>
        <div>
            <textarea id="contenu" rows="10" placeholder="Votre texte ici"></textarea>
        </div>
        <input type="color" id="couleur" value="#f6b73c">

        <input type="submit" value="Ajouter une note">
    </form>

    <div id="container"></div>
   
</body>
</html>
